name: Mise √† jour des news
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    paths: ["sources.json", "fetch.py"]
permissions:
  contents: write
concurrency: { group: fetch, cancel-in-progress: false }
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: python fetch.py
      - name: Commit
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add news.json
          git diff --staged --quiet || (git commit -m "news: $(date -u +%H:%M)" && git pull --rebase && git push)

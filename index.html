<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mes News">
<meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<title>Mes News</title>
<style>
:root{--bg:#f5f5f7;--card:rgba(255,255,255,.72);--text:#1d1d1f;--sec:#6e6e73;--accent:#0071e3;--line:rgba(0,0,0,.08);--glass:rgba(255,255,255,.6);
--rs:18px;--rbg:#fff;--rtext:#1d1d1f;--rfont:-apple-system,"SF Pro Text",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#000;--card:rgba(28,28,30,.75);--text:#f5f5f7;--sec:#98989d;--accent:#2997ff;--line:rgba(255,255,255,.1);--glass:rgba(30,30,32,.6);--rbg:#1c1c1e;--rtext:#f2f2f7}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,"SF Pro Text",system-ui,sans-serif}
body{padding-bottom:env(safe-area-inset-bottom)}
header{position:sticky;top:0;z-index:10;padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;background:var(--glass);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:.5px solid var(--line)}
.top{display:flex;align-items:center;gap:10px;max-width:1100px;margin:auto}
h1{font-size:28px;font-weight:800;margin:0;flex:1;letter-spacing:-.5px}
.ib{border:0;background:var(--card);color:var(--text);width:36px;height:36px;border-radius:50%;font-size:17px;cursor:pointer}
#q{width:100%;max-width:1100px;display:block;margin:10px auto 0;padding:9px 14px;border-radius:12px;border:0;background:var(--line);color:var(--text);font-size:16px;outline:none}
.tabs{display:flex;gap:8px;overflow-x:auto;max-width:1100px;margin:10px auto 0;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:0;padding:7px 14px;border-radius:999px;background:var(--card);color:var(--text);font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap}
.tab.on{background:var(--accent);color:#fff}
.srcs .tab{font-weight:500;font-size:13px;padding:5px 11px}
#upd{font-size:12px;color:var(--sec);text-align:center;margin:10px}
main{max-width:1100px;margin:auto;padding:0 16px 40px;display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.card{background:var(--card);border-radius:18px;overflow:hidden;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.06);transition:transform .15s;display:flex;flex-direction:column}
.card:active{transform:scale(.98)}
.card img{width:100%;aspect-ratio:16/9;object-fit:cover;background:var(--line)}
.card .b{padding:12px 14px 14px}
.meta{font-size:12px;color:var(--sec);font-weight:600;text-transform:uppercase;letter-spacing:.3px;display:flex;gap:6px}
.card h2{font-size:17px;line-height:1.3;margin:6px 0;font-weight:700}
.card p{font-size:14px;color:var(--sec);margin:0;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card.read{opacity:.5}
.empty{grid-column:1/-1;text-align:center;color:var(--sec);padding:60px}
/* Lecteur */
#reader{position:fixed;inset:0;z-index:20;background:var(--rbg);color:var(--rtext);overflow-y:auto;transform:translateX(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1);-webkit-overflow-scrolling:touch}
#reader.open{transform:none}
.rbar{position:sticky;top:0;display:flex;gap:8px;align-items:center;padding:calc(env(safe-area-inset-top) + 8px) 12px 8px;background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:.5px solid var(--line)}
.rbar .sp{flex:1}
.rbar .ib{background:var(--line);color:var(--rtext)}
article{max-width:680px;margin:auto;padding:24px 20px 80px;font-family:var(--rfont);font-size:var(--rs);line-height:1.65}
article h1{font-size:1.6em;line-height:1.2;margin:8px 0 12px;font-family:-apple-system,system-ui}
article .meta{margin-bottom:20px}
article img{max-width:100%;height:auto;border-radius:12px;display:block;margin:16px auto}
article a{color:var(--accent)}
article blockquote{border-left:3px solid var(--accent);margin:16px 0;padding-left:16px;color:var(--sec)}
article figcaption{font-size:.75em;color:var(--sec);text-align:center}
article table{width:100%;border-collapse:collapse;font-size:.8em}article td,article th{border:1px solid var(--line);padding:6px}
.orig{display:block;text-align:center;margin:30px 0;padding:12px;border-radius:12px;background:var(--line);color:var(--rtext)!important;text-decoration:none;font-family:-apple-system;font-size:15px;font-weight:600}
#prefs{display:none;position:absolute;right:12px;top:calc(env(safe-area-inset-top) + 54px);background:var(--card);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);border-radius:14px;padding:12px;box-shadow:0 8px 30px rgba(0,0,0,.2);gap:8px;flex-direction:column;z-index:2}
#prefs.on{display:flex}
#prefs div{display:flex;gap:6px}
#prefs button{flex:1;border:0;padding:8px 10px;border-radius:10px;background:var(--line);color:var(--rtext);cursor:pointer}
body.theme-sepia{--rbg:#f8f1e3;--rtext:#4f3f2c}
body.theme-light{--rbg:#fff;--rtext:#1d1d1f}
body.theme-dark{--rbg:#1c1c1e;--rtext:#f2f2f7}

/* Vue partagée Mac / iPad : vignettes à gauche, article à droite */
@media (min-width:900px){
  body.reading header{width:420px;border-right:.5px solid var(--line)}
  body.reading header>*,body.reading header #q{max-width:none;width:100%;margin-left:0;margin-right:0}
  body.reading h1{font-size:22px}
  body.reading #upd{width:420px;text-align:left;padding-left:16px;margin-left:0}
  body.reading main{grid-template-columns:1fr;max-width:none;width:420px;margin:0;gap:10px}
  body.reading .card{flex-direction:row;border-radius:14px}
  body.reading .card img{width:110px;min-width:110px;aspect-ratio:auto;height:auto;min-height:90px}
  body.reading .card .b{padding:10px 12px}
  body.reading .card h2{font-size:15px;margin:4px 0}
  body.reading .card p{display:none}
  body.reading .card.cur{outline:2px solid var(--accent);opacity:1}
  #reader{left:420px;transform:none;display:none;border-left:.5px solid var(--line);transition:none}
  #reader.open{display:block}
}
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>Mes News</h1>
    <button class="ib" id="favBtn" title="Favoris">☆</button>
    <button class="ib" id="refresh" title="Actualiser">↻</button>
  </div>
  <input id="q" type="search" placeholder="Rechercher">
  <div class="tabs" id="cats"></div>
  <div class="tabs srcs" id="srcs"></div>
</header>
<div id="upd"></div>
<main id="list"></main>

<div id="reader">
  <div class="rbar">
    <button class="ib" id="back" title="Fermer">‹</button>
    <span class="sp"></span>
    <button class="ib" id="rfav">☆</button>
    <button class="ib" id="share">⇪</button>
    <button class="ib" id="aa">Aa</button>
    <div id="prefs">
      <div><button data-s="-1">A−</button><button data-s="1">A+</button></div>
      <div><button data-f="sans">Sans</button><button data-f="serif">Serif</button></div>
      <div><button data-t="light">☀️</button><button data-t="sepia">📜</button><button data-t="dark">🌙</button><button data-t="">Auto</button></div>
    </div>
  </div>
  <article id="art"></article>
</div>

<script>
const LS=k=>JSON.parse(localStorage.getItem(k)||'null');
const SS=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
let data=null,cat=LS('cat')||'all',src='all',onlyFav=false,cur=null;
let read=new Set(LS('read')||[]),favs=LS('favs')||{};
let prefs=LS('prefs')||{s:18,f:'sans',t:''};
const $=id=>document.getElementById(id);
const esc=s=>(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function ago(d){const m=(Date.now()-new Date(d))/6e4;if(m<60)return Math.max(1,m|0)+' min';if(m<1440)return (m/60|0)+' h';return (m/1440|0)+' j'}

async function load(force){
  $('refresh').textContent='…';
  try{const r=await fetch('news.json'+(force?'?t='+Date.now():''),{cache:force?'reload':'default'});data=await r.json();SS('cache',data)}
  catch(e){data=data||LS('cache')}
  $('refresh').textContent='↻';
  if(!data){$('list').innerHTML='<div class="empty">Aucune donnée (hors ligne ?)</div>';return}
  $('upd').textContent='Mis à jour il y a '+ago(data.updated);
  renderTabs();render();
  const h=location.hash.slice(1);if(h)openArt(h,true);
}

function renderTabs(){
  const cats=[{id:'all',name:'À la une',icon:'📰'},...data.categories];
  $('cats').innerHTML=cats.map(c=>`<button class="tab ${c.id===cat?'on':''}" data-c="${c.id}">${c.icon} ${esc(c.name)}</button>`).join('');
  const c=data.categories.find(x=>x.id===cat);
  $('srcs').style.display=c?'flex':'none';
  if(c)$('srcs').innerHTML=['all',...c.sources].map(s=>`<button class="tab ${s===src?'on':''}" data-s="${esc(s)}">${s==='all'?'Toutes':esc(s)}</button>`).join('');
}

function list(){
  let a=onlyFav?Object.values(favs).sort((x,y)=>y.date.localeCompare(x.date)):data.articles;
  if(!onlyFav&&cat!=='all')a=a.filter(x=>x.category===cat);
  if(!onlyFav&&src!=='all')a=a.filter(x=>x.source===src);
  const q=$('q').value.trim().toLowerCase();
  if(q)a=a.filter(x=>(x.title+' '+x.excerpt).toLowerCase().includes(q));
  return a;
}

function render(){
  const a=list();
  $('list').innerHTML=a.length?a.slice(0,200).map(x=>`<div class="card ${read.has(x.id)?'read':''}" data-id="${x.id}">
    ${x.image?`<img src="${esc(x.image)}" loading="lazy" onerror="this.remove()">`:''}
    <div class="b"><div class="meta"><span>${esc(x.source)}</span>·<span>${ago(x.date)}</span>·<span>${x.readingTime} min</span></div>
    <h2>${esc(x.title)}</h2><p>${esc(x.excerpt)}</p></div></div>`).join(''):'<div class="empty">Aucun article</div>';
}

function find(id){return data.articles.find(x=>x.id===id)||favs[id]}
function openArt(id,noPush){
  const x=find(id);if(!x)return;cur=x;
  read.add(id);SS('read',[...read].slice(-2000));
  $('art').innerHTML=`<div class="meta">${esc(x.source)} · ${new Date(x.date).toLocaleString('fr-FR',{dateStyle:'medium',timeStyle:'short'})} · ${x.readingTime} min</div>
   <h1>${esc(x.title)}</h1>${x.content}<a class="orig" href="${esc(x.url)}" target="_blank" rel="noopener">Voir l'article original ↗</a>`;
  $('art').querySelectorAll('a').forEach(l=>{l.target='_blank';l.rel='noopener'});
  $('art').querySelectorAll('img').forEach(i=>i.onerror=()=>i.remove());
  $('rfav').textContent=favs[id]?'★':'☆';
  $('reader').scrollTop=0;$('reader').classList.add('open');document.body.classList.add('reading');document.querySelectorAll('.card.cur').forEach(c=>c.classList.remove('cur'));
  if(!noPush){location.hash&&innerWidth>=900?history.replaceState(null,'','#'+id):history.pushState(null,'','#'+id)}
  const c=document.querySelector(`.card[data-id="${id}"]`);if(c){c.classList.add('read','cur');if(innerWidth>=900)c.scrollIntoView({block:'nearest'})}
}
function closeArt(){$('reader').classList.remove('open');document.body.classList.remove('reading');document.querySelectorAll('.card.cur').forEach(c=>c.classList.remove('cur'));$('prefs').classList.remove('on');cur=null}

function applyPrefs(){
  document.documentElement.style.setProperty('--rs',prefs.s+'px');
  document.documentElement.style.setProperty('--rfont',prefs.f==='serif'?'"New York",Georgia,"Times New Roman",serif':'-apple-system,"SF Pro Text",system-ui,sans-serif');
  document.body.classList.remove('theme-light','theme-sepia','theme-dark');if(prefs.t)document.body.classList.add('theme-'+prefs.t);SS('prefs',prefs);
}

$('cats').onclick=e=>{const b=e.target.closest('[data-c]');if(!b)return;cat=b.dataset.c;src='all';onlyFav=false;$('favBtn').textContent='☆';SS('cat',cat);renderTabs();render();scrollTo(0,0)};
$('srcs').onclick=e=>{const b=e.target.closest('[data-s]');if(!b)return;src=b.dataset.s;renderTabs();render()};
$('list').onclick=e=>{const c=e.target.closest('.card');if(c)openArt(c.dataset.id)};
$('q').oninput=render;
$('refresh').onclick=()=>load(true);
$('favBtn').onclick=()=>{onlyFav=!onlyFav;$('favBtn').textContent=onlyFav?'★':'☆';render()};
$('back').onclick=()=>history.length>1&&location.hash?history.back():closeArt();
window.onpopstate=()=>{location.hash?openArt(location.hash.slice(1),true):closeArt()};
$('rfav').onclick=()=>{if(!cur)return;if(favs[cur.id])delete favs[cur.id];else favs[cur.id]=cur;SS('favs',favs);$('rfav').textContent=favs[cur.id]?'★':'☆'};
$('share').onclick=()=>{if(!cur)return;navigator.share?navigator.share({title:cur.title,url:cur.url}).catch(()=>{}):navigator.clipboard.writeText(cur.url)};
$('aa').onclick=()=>$('prefs').classList.toggle('on');
$('prefs').onclick=e=>{const b=e.target;if(b.dataset.s)prefs.s=Math.min(28,Math.max(14,prefs.s+ +b.dataset.s*2));if(b.dataset.f)prefs.f=b.dataset.f;if(b.dataset.t!==undefined)prefs.t=b.dataset.t;applyPrefs()};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&cur)$('back').click()});
// swipe retour sur iPhone
let sx=null;$('reader').addEventListener('touchstart',e=>{sx=e.touches[0].clientX<30?e.touches[0].clientX:null},{passive:true});
$('reader').addEventListener('touchend',e=>{if(sx!==null&&e.changedTouches[0].clientX-sx>80)$('back').click();sx=null});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&data&&Date.now()-new Date(data.updated)>30*6e4)load(true)});

applyPrefs();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
load(false);
</script>
</body>
</html>

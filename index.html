<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mes News">
<meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<title>Mes News</title>
<style>
:root{--bg:#f5f5f7;--card:rgba(255,255,255,.72);--text:#1d1d1f;--sec:#6e6e73;--accent:#0071e3;--line:rgba(0,0,0,.08);--glass:rgba(255,255,255,.6);
--rs:18px;--rbg:#fff;--rtext:#1d1d1f;--rfont:-apple-system,"SF Pro Text",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#000;--card:rgba(28,28,30,.75);--text:#f5f5f7;--sec:#98989d;--accent:#2997ff;--line:rgba(255,255,255,.1);--glass:rgba(30,30,32,.6);--rbg:#1c1c1e;--rtext:#f2f2f7}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,"SF Pro Text",system-ui,sans-serif}
body{padding-bottom:env(safe-area-inset-bottom)}
header{position:sticky;top:0;z-index:10;padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;background:var(--glass);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:.5px solid var(--line)}
.top{display:flex;align-items:center;gap:10px;max-width:1100px;margin:auto}
h1{font-size:28px;font-weight:800;margin:0;flex:1;letter-spacing:-.5px}
.ib{border:0;background:var(--card);color:var(--text);width:36px;height:36px;border-radius:50%;font-size:17px;cursor:pointer}
#q{width:100%;max-width:1100px;display:block;margin:10px auto 0;padding:9px 14px;border-radius:12px;border:0;background:var(--line);color:var(--text);font-size:16px;outline:none}
.tabs{display:flex;gap:8px;overflow-x:auto;max-width:1100px;margin:10px auto 0;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:0;padding:7px 14px;border-radius:999px;background:var(--card);color:var(--text);font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap}
.tab.on{background:var(--accent);color:#fff}
.srcs .tab{font-weight:500;font-size:13px;padding:5px 11px}
#upd{font-size:12px;color:var(--sec);text-align:center;margin:10px}
main{max-width:1100px;margin:auto;padding:0 16px 40px;display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.card{background:var(--card);border-radius:18px;overflow:hidden;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.06);transition:transform .15s;display:flex;flex-direction:column}
.card:active{transform:scale(.98)}
.card img{width:100%;aspect-ratio:16/9;object-fit:cover;background:var(--line)}
.card .b{padding:12px 14px 14px}
.meta{font-size:12px;color:var(--sec);font-weight:600;text-transform:uppercase;letter-spacing:.3px;display:flex;gap:6px}
.card h2{font-size:17px;line-height:1.3;margin:6px 0;font-weight:700}
.card p{font-size:14px;color:var(--sec);margin:0;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card.read{opacity:.5}
.empty{grid-column:1/-1;text-align:center;color:var(--sec);padding:60px}
/* Lecteur */
#reader{position:fixed;inset:0;z-index:20;background:var(--rbg);color:var(--rtext);overflow-y:auto;transform:translateX(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1);-webkit-overflow-scrolling:touch}
#reader.open{transform:none}
.rbar{position:sticky;top:0;display:flex;gap:8px;align-items:center;padding:calc(env(safe-area-inset-top) + 8px) 12px 8px;background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:.5px solid var(--line)}
.rbar .sp{flex:1}
.rbar .ib{background:var(--line);color:var(--rtext)}
article{max-width:680px;margin:auto;padding:24px 20px 80px;font-family:var(--rfont);font-size:var(--rs);line-height:1.65}
article h1{font-size:1.6em;line-height:1.2;margin:8px 0 12px;font-family:-apple-system,system-ui}
article .meta{margin-bottom:20px}
article img{max-width:100%;height:auto;border-radius:12px;display:block;margin:16px auto}
article a{color:var(--accent)}
article blockquote{border-left:3px solid var(--accent);margin:16px 0;padding-left:16px;color:var(--sec)}
article figcaption{font-size:.75em;color:var(--sec);text-align:center}
article table{width:100%;border-collapse:collapse;font-size:.8em}article td,article th{border:1px solid var(--line);padding:6px}
.orig{display:block;text-align:center;margin:30px 0;padding:12px;border-radius:12px;background:var(--line);color:var(--rtext)!important;text-decoration:none;font-family:-apple-system;font-size:15px;font-weight:600}
#prefs{display:none;position:absolute;right:12px;top:calc(env(safe-area-inset-top) + 54px);background:var(--card);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);border-radius:14px;padding:12px;box-shadow:0 8px 30px rgba(0,0,0,.2);gap:8px;flex-direction:column;z-index:2}
#prefs.on{display:flex}
#prefs div{display:flex;gap:6px}
#prefs button{flex:1;border:0;padding:8px 10px;border-radius:10px;background:var(--line);color:var(--rtext);cursor:pointer}
body.theme-sepia{--rbg:#f8f1e3;--rtext:#4f3f2c}
body.theme-light{--rbg:#fff;--rtext:#1d1d1f}
body.theme-dark{--rbg:#1c1c1e;--rtext:#f2f2f7}

/* Vue partagée Mac / iPad : vignettes à gauche, article à droite */
@media (min-width:900px){
  body.reading header{width:420px;border-right:.5px solid var(--line)}
  body.reading header>*,body.reading header #q{max-width:none;width:100%;margin-left:0;margin-right:0}
  body.reading h1{font-size:22px}
  body.reading #upd{width:420px;text-align:left;padding-left:16px;margin-left:0}
  body.reading main{grid-template-columns:1fr;max-width:none;width:420px;margin:0;gap:10px}
  body.reading .card{flex-direction:row;border-radius:14px}
  body.reading .card img{width:110px;min-width:110px;aspect-ratio:auto;height:auto;min-height:90px}
  body.reading .card .b{padding:10px 12px}
  body.reading .card h2{font-size:15px;margin:4px 0}
  body.reading .card p{display:none}
  body.reading .card.cur{outline:2px solid var(--accent);opacity:1}
  #reader{left:420px;transform:none;display:none;border-left:.5px solid var(--line);transition:none}
  #reader.open{display:block}
}

#cfg{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.35);display:none;align-items:flex-end;justify-content:center}
#cfg.on{display:flex}
#cfg .sheet{background:var(--bg);width:100%;max-width:520px;max-height:85vh;overflow-y:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(env(safe-area-inset-bottom) + 20px)}
@media (min-width:900px){#cfg{align-items:center}#cfg .sheet{border-radius:20px}}
#cfg .hd{display:flex;align-items:center;margin-bottom:8px}#cfg .hd b{flex:1;font-size:20px}
#cfg .grp{background:var(--card);border-radius:14px;margin:8px 0 18px;overflow:hidden}
#cfg .gt{display:flex;justify-content:space-between;font-size:13px;color:var(--sec);text-transform:uppercase;font-weight:600;margin-top:10px;padding:0 4px}
#cfg .gt button{border:0;background:none;color:var(--accent);font-size:13px;cursor:pointer}
#cfg label{display:flex;align-items:center;padding:12px 14px;border-bottom:.5px solid var(--line);font-size:16px;cursor:pointer}
#cfg label:last-child{border:0}#cfg label span{flex:1}#cfg label small{color:var(--sec);margin-right:10px}
.sw{appearance:none;-webkit-appearance:none;width:46px;height:28px;border-radius:14px;background:var(--line);position:relative;cursor:pointer;transition:.2s;margin:0}
.sw:checked{background:#34c759}.sw::after{content:"";position:absolute;top:2px;left:2px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:.2s}.sw:checked::after{left:20px}

/* ---------- Accueil animé ---------- */
#home{position:relative;max-width:1100px;margin:14px auto 18px;padding:0 16px}
.hero{position:relative;overflow:hidden;border-radius:26px;min-height:300px;padding:32px 26px;color:#fff;
 background:linear-gradient(120deg,#0a84ff,#5e5ce6,#bf5af2,#ff375f,#ff9f0a);background-size:400% 400%;animation:grad 16s ease infinite}
@keyframes grad{0%{background-position:0 50%}50%{background-position:100% 50%}100%{background-position:0 50%}}
.hero .txt{position:relative;z-index:2;max-width:560px}
.hero h2{font-size:38px;line-height:1.05;margin:0 0 8px;font-weight:800;letter-spacing:-1px}
.hero p{margin:0;font-size:16px;opacity:.9}
.hero .go{margin-top:18px;border:0;padding:11px 20px;border-radius:999px;background:rgba(255,255,255,.25);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:#fff;font-weight:700;font-size:15px;cursor:pointer}
.fl{position:absolute;z-index:1;font-size:44px;filter:drop-shadow(0 6px 12px rgba(0,0,0,.25));animation:float 7s ease-in-out infinite;user-select:none}
@keyframes float{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-22px) rotate(8deg)}}
.orbit{position:absolute;right:-40px;top:50%;width:340px;height:340px;margin-top:-170px;border:1.5px dashed rgba(255,255,255,.35);border-radius:50%;animation:spin 40s linear infinite;z-index:1}
.orbit span{position:absolute;font-size:30px;animation:spin 40s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.ticker{margin-top:14px;overflow:hidden;white-space:nowrap;border-radius:14px;background:var(--card);padding:10px 0;font-size:14px}
.ticker div{display:inline-block;padding-left:100%;animation:tick 60s linear infinite}
.ticker:hover div{animation-play-state:paused}
.ticker b{color:var(--accent);margin:0 6px 0 22px}
@keyframes tick{to{transform:translateX(-100%)}}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-top:14px}
.chip{background:var(--card);border-radius:18px;padding:14px;cursor:pointer;transition:transform .2s;animation:pop .5s backwards}
.chip:hover{transform:translateY(-3px)}
.chip .ic{font-size:28px}.chip b{display:block;margin:4px 0 2px;font-size:16px}.chip small{color:var(--sec);font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
@keyframes pop{from{opacity:0;transform:translateY(14px)}}
.sec{max-width:1100px;margin:8px auto 10px;padding:0 16px;font-size:22px;font-weight:800}
body.reading #home,body.reading .sec{display:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
@media (max-width:600px){.hero h2{font-size:30px}.orbit{width:240px;height:240px;margin-top:-120px;right:-90px;opacity:.7}}
/* ---------- Gestion des sites ---------- */
#cfg .del{border:0;background:none;color:#ff3b30;font-size:18px;cursor:pointer;margin-right:8px;padding:0 4px}
#cfg .warn{color:#ff9f0a;font-size:12px;margin-right:8px}
#cfg .add{display:flex;gap:6px;padding:10px 14px;flex-wrap:wrap}
#cfg input[type=text],#cfg input[type=password]{flex:1;min-width:120px;padding:9px 11px;border-radius:10px;border:0;background:var(--line);color:var(--text);font-size:15px;outline:none}
#cfg .btn{border:0;padding:9px 14px;border-radius:10px;background:var(--accent);color:#fff;font-weight:600;cursor:pointer;font-size:14px}
#cfg .note{font-size:13px;color:var(--sec);padding:0 4px;line-height:1.4}
#cfg .msg{padding:10px 12px;border-radius:12px;margin:8px 0;font-size:14px;display:none}
#cfg .msg.on{display:block}#cfg .msg.ok{background:rgba(52,199,89,.15)}#cfg .msg.err{background:rgba(255,59,48,.15)}
#cfg details summary{cursor:pointer;color:var(--accent);font-size:14px;padding:4px;margin-top:6px}

</style>
</head>
<body>
<header>
  <div class="top">
    <h1>Mes News</h1>
    <button class="ib" id="favBtn" title="Favoris">☆</button>
    <button class="ib" id="refresh" title="Actualiser">↻</button>
    <button class="ib" id="gear" title="Choisir les sites">⚙︎</button>
  </div>
  <input id="q" type="search" placeholder="Rechercher">
  <div class="tabs" id="cats"></div>
  <div class="tabs srcs" id="srcs"></div>
</header>
<section id="home"></section>
<div class="sec" id="secT"></div>
<div id="upd"></div>
<main id="list"></main>

<div id="cfg"><div class="sheet">
  <div class="hd"><b>Mes sites</b><button class="ib" id="cfgClose">✓</button></div>
  <div class="msg" id="cfgMsg"></div>
  <div id="cfgList"></div>
  <div class="gt"><span>➕ Nouvelle catégorie</span></div>
  <div class="grp"><div class="add"><input type="text" id="ncIcon" placeholder="🎬" style="max-width:60px;min-width:60px"><input type="text" id="ncName" placeholder="Nom de la catégorie"><button class="btn" id="ncAdd">Créer</button></div></div>
  <details id="ghBox"><summary>🔑 Connexion GitHub (nécessaire pour ajouter / supprimer)</summary>
   <div class="grp"><div class="add"><input type="text" id="ghRepo" placeholder="pseudo/news-reader"></div>
   <div class="add"><input type="password" id="ghTok" placeholder="Jeton GitHub (github_pat_…)"><button class="btn" id="ghSave">Enregistrer</button></div></div>
   <p class="note">Le jeton reste uniquement sur cet appareil. Il sert à modifier la liste des sites du robot, qui récupère ensuite les nouveaux articles en 2 à 3 minutes.</p>
  </details>
</div></div>
<div id="reader">
  <div class="rbar">
    <button class="ib" id="back" title="Fermer">‹</button>
    <span class="sp"></span>
    <button class="ib" id="rfav">☆</button>
    <button class="ib" id="share">⇪</button>
    <button class="ib" id="aa">Aa</button>
    <div id="prefs">
      <div><button data-s="-1">A−</button><button data-s="1">A+</button></div>
      <div><button data-f="sans">Sans</button><button data-f="serif">Serif</button></div>
      <div><button data-t="light">☀️</button><button data-t="sepia">📜</button><button data-t="dark">🌙</button><button data-t="">Auto</button></div>
    </div>
  </div>
  <article id="art"></article>
</div>

<script>
const LS=k=>JSON.parse(localStorage.getItem(k)||'null');
const SS=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
let data=null,cat=LS('cat')||'all',src='all',onlyFav=false,cur=null;
let off=new Set(LS('off')||[]),read=new Set(LS('read')||[]),favs=LS('favs')||{};
let prefs=LS('prefs')||{s:18,f:'sans',t:''};
const $=id=>document.getElementById(id);
const esc=s=>(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function ago(d){const m=(Date.now()-new Date(d))/6e4;if(m<60)return Math.max(1,m|0)+' min';if(m<1440)return (m/60|0)+' h';return (m/1440|0)+' j'}

async function load(force){
  $('refresh').textContent='…';
  try{const r=await fetch('news.json'+(force?'?t='+Date.now():''),{cache:force?'reload':'default'});data=await r.json();SS('cache',data)}
  catch(e){data=data||LS('cache')}
  $('refresh').textContent='↻';
  if(!data){$('list').innerHTML='<div class="empty">Aucune donnée (hors ligne ?)</div>';return}
  $('upd').textContent='Mis à jour il y a '+ago(data.updated);
  renderTabs();render();
  const h=location.hash.slice(1);if(h)openArt(h,true);
}

function renderTabs(){
  const cats=[{id:'all',name:'À la une',icon:'📰'},...data.categories];
  $('cats').innerHTML=cats.map(c=>`<button class="tab ${c.id===cat?'on':''}" data-c="${c.id}">${c.icon} ${esc(c.name)}</button>`).join('');
  const c=data.categories.find(x=>x.id===cat);
  $('srcs').style.display=c?'flex':'none';
  if(c)$('srcs').innerHTML=['all',...c.sources.filter(x=>!off.has(x))].map(s=>`<button class="tab ${s===src?'on':''}" data-s="${esc(s)}">${s==='all'?'Toutes':esc(s)}</button>`).join('');
}

function list(){
  let a=onlyFav?Object.values(favs).sort((x,y)=>y.date.localeCompare(x.date)):data.articles;
  if(!onlyFav)a=a.filter(x=>!off.has(x.source));
  if(!onlyFav&&cat!=='all')a=a.filter(x=>x.category===cat);
  if(!onlyFav&&src!=='all')a=a.filter(x=>x.source===src);
  const q=$('q').value.trim().toLowerCase();
  if(q)a=a.filter(x=>(x.title+' '+x.excerpt).toLowerCase().includes(q));
  return a;
}

function render(){
  const a=list();
  $('list').innerHTML=(a.length?a.slice(0,200).map(x=>`<div class="card ${read.has(x.id)?'read':''}" data-id="${x.id}">
    ${x.image?`<img src="${esc(x.image)}" loading="lazy" onerror="this.remove()">`:''}
    <div class="b"><div class="meta"><span>${esc(x.source)}</span>·<span>${ago(x.date)}</span>·<span>${x.readingTime} min</span></div>
    <h2>${esc(x.title)}</h2><p>${esc(x.excerpt)}</p></div></div>`).join(''):'<div class="empty">Aucun article</div>');
}

function find(id){return data.articles.find(x=>x.id===id)||favs[id]}
function openArt(id,noPush){
  const x=find(id);if(!x)return;cur=x;
  read.add(id);SS('read',[...read].slice(-2000));
  $('art').innerHTML=`<div class="meta">${esc(x.source)} · ${new Date(x.date).toLocaleString('fr-FR',{dateStyle:'medium',timeStyle:'short'})} · ${x.readingTime} min</div>
   <h1>${esc(x.title)}</h1>${x.content}<a class="orig" href="${esc(x.url)}" target="_blank" rel="noopener">Voir l'article original ↗</a>`;
  $('art').querySelectorAll('a').forEach(l=>{l.target='_blank';l.rel='noopener'});
  $('art').querySelectorAll('img').forEach(i=>i.onerror=()=>i.remove());
  $('rfav').textContent=favs[id]?'★':'☆';
  $('reader').scrollTop=0;$('reader').classList.add('open');document.body.classList.add('reading');document.querySelectorAll('.card.cur').forEach(c=>c.classList.remove('cur'));
  if(!noPush){location.hash&&innerWidth>=900?history.replaceState(null,'','#'+id):history.pushState(null,'','#'+id)}
  const c=document.querySelector(`.card[data-id="${id}"]`);if(c){c.classList.add('read','cur');if(innerWidth>=900)c.scrollIntoView({block:'nearest'})}
}
function closeArt(){$('reader').classList.remove('open');document.body.classList.remove('reading');document.querySelectorAll('.card.cur').forEach(c=>c.classList.remove('cur'));$('prefs').classList.remove('on');cur=null}

function applyPrefs(){
  document.documentElement.style.setProperty('--rs',prefs.s+'px');
  document.documentElement.style.setProperty('--rfont',prefs.f==='serif'?'"New York",Georgia,"Times New Roman",serif':'-apple-system,"SF Pro Text",system-ui,sans-serif');
  document.body.classList.remove('theme-light','theme-sepia','theme-dark');if(prefs.t)document.body.classList.add('theme-'+prefs.t);SS('prefs',prefs);
}

$('cats').onclick=e=>{const b=e.target.closest('[data-c]');if(!b)return;cat=b.dataset.c;src='all';onlyFav=false;$('favBtn').textContent='☆';SS('cat',cat);renderTabs();render();scrollTo(0,0)};
$('srcs').onclick=e=>{const b=e.target.closest('[data-s]');if(!b)return;src=b.dataset.s;renderTabs();render()};
$('list').onclick=e=>{const c=e.target.closest('.card');if(c)openArt(c.dataset.id)};
$('q').oninput=()=>render();
$('refresh').onclick=()=>load(true);
$('favBtn').onclick=()=>{onlyFav=!onlyFav;$('favBtn').textContent=onlyFav?'★':'☆';render()};
$('back').onclick=()=>history.length>1&&location.hash?history.back():closeArt();
window.onpopstate=()=>{location.hash?openArt(location.hash.slice(1),true):closeArt()};
$('rfav').onclick=()=>{if(!cur)return;if(favs[cur.id])delete favs[cur.id];else favs[cur.id]=cur;SS('favs',favs);$('rfav').textContent=favs[cur.id]?'★':'☆'};
$('share').onclick=()=>{if(!cur)return;navigator.share?navigator.share({title:cur.title,url:cur.url}).catch(()=>{}):navigator.clipboard.writeText(cur.url)};
$('aa').onclick=()=>$('prefs').classList.toggle('on');
$('prefs').onclick=e=>{const b=e.target;if(b.dataset.s)prefs.s=Math.min(28,Math.max(14,prefs.s+ +b.dataset.s*2));if(b.dataset.f)prefs.f=b.dataset.f;if(b.dataset.t!==undefined)prefs.t=b.dataset.t;applyPrefs()};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&cur)$('back').click()});
// swipe retour sur iPhone
let sx=null;$('reader').addEventListener('touchstart',e=>{sx=e.touches[0].clientX<30?e.touches[0].clientX:null},{passive:true});
$('reader').addEventListener('touchend',e=>{if(sx!==null&&e.changedTouches[0].clientX-sx>80)$('back').click();sx=null});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&data&&Date.now()-new Date(data.updated)>30*6e4)load(true)});

let renderCfg;function _oldCfg(){
  const n={};data.articles.forEach(a=>n[a.source]=(n[a.source]||0)+1);
  $('cfgList').innerHTML=data.categories.map(c=>`<div class="gt"><span>${c.icon} ${esc(c.name)}</span><button data-all="${c.id}">${c.sources.every(x=>!off.has(x))?'Tout désactiver':'Tout activer'}</button></div>
  <div class="grp">${c.sources.map(x=>`<label><span>${esc(x)}</span><small>${n[x]||0}</small><input type="checkbox" class="sw" data-src="${esc(x)}" ${off.has(x)?'':'checked'}></label>`).join('')}</div>`).join('');
}
function saveCfg(){SS('off',[...off]);const c=data.categories.find(x=>x.id===cat);if(c&&!c.sources.some(x=>!off.has(x)))cat='all';if(off.has(src))src='all';renderTabs();render();renderCfg()}
$('gear').onclick=()=>{if(!data)return;renderCfg();$('cfg').classList.add('on')};
$('cfgClose').onclick=()=>$('cfg').classList.remove('on');
$('cfg').onclick=e=>{if(e.target.id==='cfg')$('cfg').classList.remove('on')};
$('cfgList').onchange=e=>{const s=e.target.dataset.src;if(!s)return;e.target.checked?off.delete(s):off.add(s);saveCfg()};
$('cfgList').onclick=e=>{const id=e.target.dataset.all;if(!id)return;const c=data.categories.find(x=>x.id===id);const allOn=c.sources.every(x=>!off.has(x));c.sources.forEach(x=>allOn?off.add(x):off.delete(x));saveCfg()};

/* ---------- Accueil ---------- */
const FLOAT=['','📱','💻','⌚️','🎧','🎮','🕹️','👾','🤖','🧠','🚀','⚡️'];
function renderHome(){
  const show=cat==='all'&&!onlyFav&&!$('q').value.trim();
  $('home').style.display=show?'block':'none';
  $('secT').textContent=onlyFav?'⭐️ Favoris':show?'Dernières actus':'';
  if(!show||!data)return;
  const h=new Date().getHours(),hi=h<6?'Bonne nuit':h<12?'Bonjour':h<18?'Bon après-midi':'Bonsoir';
  const vis=data.articles.filter(a=>!off.has(a.source));
  const today=vis.filter(a=>Date.now()-new Date(a.date)<864e5).length;
  const fl=FLOAT.map((e,i)=>`<span class="fl" style="left:${(i*37+8)%92}%;top:${(i*53+12)%80}%;animation-delay:-${i*0.7}s;animation-duration:${6+i%4}s;font-size:${28+(i*7)%26}px;opacity:${i<4?1:.85}">${e}</span>`).join('');
  const orb=['','🎮','🤖','📱','🕹️','💡'].map((e,i)=>{const a=i/6*2*Math.PI;return `<span style="left:${50+50*Math.cos(a)}%;top:${50+50*Math.sin(a)}%;margin:-18px">${e}</span>`}).join('');
  const cats=data.categories.filter(c=>c.sources.some(x=>!off.has(x)));
  $('home').innerHTML=`<div class="hero">${fl}<div class="orbit">${orb}</div>
    <div class="txt"><p>${new Date().toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'})}</p>
    <h2>${hi} Nico 👋</h2><p>${today} nouveaux articles aujourd'hui sur Apple, la tech, l'IA et les jeux vidéo.<br>Sans pub, sans pop-up, juste l'essentiel.</p>
    <button class="go" id="goBtn">Commencer la lecture ↓</button></div></div>
    <div class="ticker"><div>${vis.slice(0,12).map(a=>`<b>${esc(a.source)}</b><a data-id="${a.id}" style="color:inherit;cursor:pointer">${esc(a.title)}</a>`).join('')}</div></div>
    <div class="chips">${cats.map((c,i)=>{const l=vis.find(a=>a.category===c.id);const n=vis.filter(a=>a.category===c.id).length;
      return `<div class="chip" data-c="${c.id}" style="animation-delay:${i*.08}s"><span class="ic">${c.icon||'📰'}</span><b>${esc(c.name)} · ${n}</b><small>${l?esc(l.title):'Aucun article pour le moment'}</small></div>`}).join('')}</div>`;
  $('goBtn').onclick=()=>$('secT').scrollIntoView({behavior:'smooth'});
}
$('home').onclick=e=>{const c=e.target.closest('.chip');if(c){document.querySelector(`#cats [data-c="${c.dataset.c}"]`).click();return}
 const a=e.target.closest('[data-id]');if(a)openArt(a.dataset.id)};
const _render=render;render=function(){_render();renderHome()};

/* ---------- Ajout / suppression de sites via GitHub ---------- */
let gh=LS('gh')||{repo:'lechatelier-creatif/news-reader',tok:''};
$('ghRepo').value=gh.repo;$('ghTok').value=gh.tok;
$('ghSave').onclick=()=>{gh={repo:$('ghRepo').value.trim(),tok:$('ghTok').value.trim()};SS('gh',gh);msg('Connexion enregistrée ✓','ok')};
function msg(t,k){const m=$('cfgMsg');m.textContent=t;m.className='msg on '+(k||'');if(k==='ok')setTimeout(()=>m.className='msg',5000)}
const b64e=s=>btoa(unescape(encodeURIComponent(s))),b64d=s=>decodeURIComponent(escape(atob(s.replace(/\n/g,''))));
async function editSources(fn,label){
  if(!gh.tok){$('ghBox').open=true;msg("Ajoute d'abord ton jeton GitHub ci-dessous 👇",'err');return false}
  msg('Enregistrement…');
  const api=`https://api.github.com/repos/${gh.repo}/contents/sources.json`,H={Authorization:'Bearer '+gh.tok,Accept:'application/vnd.github+json'};
  try{
    const r=await fetch(api,{headers:H,cache:'no-store'});if(!r.ok)throw new Error(r.status===401?'Jeton invalide':r.status===404?'Dépôt introuvable':'Erreur '+r.status);
    const f=await r.json(),cfg=JSON.parse(b64d(f.content));
    fn(cfg);
    const p=await fetch(api,{method:'PUT',headers:H,body:JSON.stringify({message:label,content:b64e(JSON.stringify(cfg,null,2)),sha:f.sha})});
    if(!p.ok)throw new Error(p.status===403?"Le jeton n'a pas le droit d'écrire (Contents : Read and write)":'Erreur '+p.status);
    // mise à jour locale immédiate
    data.categories=cfg.categories.map(c=>{const o=data.categories.find(x=>x.id===c.id)||{};return {id:c.id,name:c.name,icon:c.icon||'',sources:c.sources.map(s=>s.name),status:o.status||{}}});
    data.articles=data.articles.filter(a=>data.categories.some(c=>c.id===a.category&&c.sources.includes(a.source)));
    SS('cache',data);renderTabs();render();renderCfg();
    msg(label+' ✓ Les articles arrivent dans 2 à 3 minutes, puis touche ↻.','ok');return true;
  }catch(e){msg('⚠️ '+e.message,'err');return false}
}
function slug(t){return t.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'cat'+Date.now()}
renderCfg=function(){
  const n={};data.articles.forEach(a=>n[a.source]=(n[a.source]||0)+1);
  $('cfgList').innerHTML=data.categories.map(c=>`<div class="gt"><span>${c.icon} ${esc(c.name)}</span><span><button data-all="${c.id}">${c.sources.every(x=>!off.has(x))?'Tout désactiver':'Tout activer'}</button> <button data-delcat="${c.id}" style="color:#ff3b30">Supprimer</button></span></div>
  <div class="grp">${c.sources.map(x=>{const st=(c.status||{})[x];return `<label><button class="del" data-del="${esc(x)}" data-cat="${c.id}" title="Supprimer">⊖</button><span>${esc(x)}</span>${st&&st!=='ok'?`<span class="warn">⚠️ ${esc(st)}</span>`:`<small>${n[x]||0}</small>`}<input type="checkbox" class="sw" data-src="${esc(x)}" ${off.has(x)?'':'checked'}></label>`}).join('')}
  <div class="add"><input type="text" placeholder="Nom (ex : Numerama)" data-nn="${c.id}"><input type="text" placeholder="Adresse du site ou du flux RSS" data-nu="${c.id}"><button class="btn" data-addto="${c.id}">Ajouter</button></div></div>`).join('');
};
$('cfgList').addEventListener('click',async e=>{
  const t=e.target;
  if(t.dataset.del){e.preventDefault();if(!confirm(`Supprimer « ${t.dataset.del} » ?`))return;
    editSources(cfg=>{const c=cfg.categories.find(x=>x.id===t.dataset.cat);c.sources=c.sources.filter(s=>s.name!==t.dataset.del)},'Site supprimé : '+t.dataset.del)}
  if(t.dataset.delcat){const c=data.categories.find(x=>x.id===t.dataset.delcat);if(!confirm(`Supprimer la catégorie « ${c.name} » et ses ${c.sources.length} sites ?`))return;
    if(cat===c.id)cat='all';editSources(cfg=>{cfg.categories=cfg.categories.filter(x=>x.id!==c.id)},'Catégorie supprimée : '+c.name)}
  if(t.dataset.addto){const id=t.dataset.addto,nm=document.querySelector(`[data-nn="${id}"]`).value.trim(),u=document.querySelector(`[data-nu="${id}"]`).value.trim();
    if(!nm||!u){msg('Indique un nom et une adresse','err');return}
    editSources(cfg=>{cfg.categories.find(x=>x.id===id).sources.push({name:nm,feed:/^https?:/.test(u)?u:'https://'+u})},'Site ajouté : '+nm)}
});
$('ncAdd').onclick=()=>{const nm=$('ncName').value.trim(),ic=$('ncIcon').value.trim()||'📰';if(!nm){msg('Donne un nom à la catégorie','err');return}
  editSources(cfg=>cfg.categories.push({id:slug(nm),name:nm,icon:ic,sources:[]}),'Catégorie créée : '+nm).then(ok=>{if(ok){$('ncName').value='';$('ncIcon').value=''}})};

applyPrefs();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
load(false);
</script>
</body>
